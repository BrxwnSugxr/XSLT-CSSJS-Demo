<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title</title>
    <style>
      h1 {
        text-align: center;
        padding-inline: 10px;
      }

      #headingTag:hover {
        transform: scale(2);
      }
    </style>
    <script>
      function changeColor(colorValue) {
        document.getElementById("headingTag").style.color = colorValue;
      }
    </script>
  </head>
  <body>
    <h1 id="headingTag">Univeristy of wollonong</h1>
    <button onclick="changeColor('orange')">orange</button>
    <button onclick="changeColor('blue')">blue</button>
    <button onclick="changeColor('green')">green</button>
  </body>
</html>
